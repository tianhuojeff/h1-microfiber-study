  <rect x="670" y="813" width="157" height="50" rx="5" fill="#a76f2b"/>
  <text class="cn value" x="848" y="848">4/14　28.6%</text>
  <text class="cn label" x="100" y="941">目标物实际取出/倒出或已验证移出</text>
