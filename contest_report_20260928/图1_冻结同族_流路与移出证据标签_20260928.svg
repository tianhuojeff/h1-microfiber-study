  <text class="cn foot" x="100" y="1102">读图提示：同一同族可拥有多个标签；柱长不是流程转化率，标签之间也不应相减。</text>
  <text class="cn foot" x="100" y="1137">统计边界：14 个经人工全文复核的定向同族样本，截至 2026-09-28；不推断行业总体、市场份额或实际性能。</text>
