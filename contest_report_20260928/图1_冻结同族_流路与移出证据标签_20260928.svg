  <rect width="1600" height="1180" fill="#ffffff"/>
  <text class="cn title" x="100" y="82">图1　冻结同族样本的流路与移出证据标签</text>
  <text class="cn subtitle" x="100" y="123">计数单位：具有该类文本披露的不同同族；所有比例的分母均为 14</text>

