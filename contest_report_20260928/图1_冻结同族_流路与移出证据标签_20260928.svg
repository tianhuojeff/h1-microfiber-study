<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">图1 冻结定向样本中流路与移出证据标签的同族计数</title>
  <desc id="desc">14个冻结定向同族样本的多标签水平柱状图。任意液相通路或接口13，明确对外液相出口或排出9；可移出承载物或组件12，文本披露目标物或收集容器移出路径4，目标物实际取出、倒出或已验证移出0。各项可重叠，分母均为14。</desc>
